[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-26-distributed-lock"
version = "0.1.0"
description = "Lab for the corresponding chapter of Linux Distributed Systems Programming with Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Weqaar Janjua", email = "weqaar.janjua@packetfive.com" }]
dependencies = []

[project.optional-dependencies]
# Everything the quality gates need. One command installs a working dev setup:
#   pip install -e ".[dev]"
dev = [
  "pybootstrap[gates] @ git+https://github.com/packetfive/pybootstrap.git@32a0e5c64a3a2fe3269a051ec39700a9b9a25a55",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Quality gates.
#
# This table says which checks make up "done" for this project. It does not
# restate anything the tools below already know: sources, line length and test
# paths are read from their own tables. One fact, one place.
# ---------------------------------------------------------------------------
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 80
coverage-package = "lab_26_distributed_lock"

# ---------------------------------------------------------------------------
# Standard tool configuration. Each tool stays usable on its own:
#   ruff check src tests
#   pyright src tests
#   pytest
# behave identically whether or not pybootstrap is involved.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
# Tells the import sorter that lab_26_distributed_lock is this project rather than a
# third-party package. Without it a src layout has first-party imports grouped
# with the dependencies, and the lint gate reports a sorting error on a file
# nobody has touched.
src = ["src", "tests"]

[tool.ruff.lint]
# E and F are the pyflakes and pycodestyle core, I keeps imports sorted, UP
# rewrites syntax that a newer Python made obsolete.
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath lets the suite run straight after 'git clone', before anyone has
# installed the project. Without it a src layout gives ModuleNotFoundError on a
# fresh checkout, which reads as a broken project rather than a missing step.
pythonpath = ["src"]
addopts = "--cov-report=term-missing --import-mode=importlib"
