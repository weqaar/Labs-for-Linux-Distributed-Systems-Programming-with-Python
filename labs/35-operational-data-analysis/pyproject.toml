[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-35-operational-data-analysis"
version = "0.1.0"
description = "Validate recorded relay attempts and compare releases in a statistical web report."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Weqaar Janjua", email = "weqaar.janjua@packetfive.com" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3.1",
  "matplotlib>=3.8,<4",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<0.16",
]

[project.scripts]
sigraft-analysis = "lab_35_operational_data_analysis.service:main"

[project.optional-dependencies]
# Everything the quality gates need. One command installs a working dev setup:
#   pip install -e ".[dev]"
dev = [
  "pybootstrap[gates] @ git+https://github.com/packetfive/pybootstrap.git@32a0e5c64a3a2fe3269a051ec39700a9b9a25a55",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab_35_operational_data_analysis = ["data/observations.csv"]

# ---------------------------------------------------------------------------
# Quality gates.
#
# Select required gates here; configure their tools in the tables below.
# ---------------------------------------------------------------------------
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 80
coverage-package = "lab_35_operational_data_analysis"

# ---------------------------------------------------------------------------
# Standard tool configuration. Each tool stays usable on its own:
#   ruff check src tests
#   pyright src tests
#   pytest
# behave identically whether or not pybootstrap is involved.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
# Tells the import sorter that lab_35_operational_data_analysis is this project rather than a
# third-party package, so imports from this source tree form their own group.
src = ["src", "tests"]

[tool.ruff.lint]
# E checks pycodestyle errors, F checks Pyflakes rules, I checks import order,
# and UP checks for syntax that can use newer Python features.
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Add local sources to pytest's import path; dependencies still need installation.
pythonpath = ["src"]
addopts = "--cov-report=term-missing --import-mode=importlib"
