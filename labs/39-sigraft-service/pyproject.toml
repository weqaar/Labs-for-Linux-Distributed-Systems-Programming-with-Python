[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-39-sigraft-service"
version = "0.1.0"
description = "Completed SigRaft service and release lab."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Weqaar Janjua", email = "weqaar.janjua@packetfive.com" }]
dependencies = [
  "graphql-core>=3.2,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
  "pandas>=2.1,<3.1",
  "PyYAML>=6",
  "scipy>=1.11,<2",
  "statsmodels>=0.14,<0.16",
  "tomli>=2",
]

[project.scripts]
sigraft-service = "lab_39_sigraft_service.sigraft_service:main"
sigraft-analysis = "lab_39_sigraft_service.analytics_service:main"
sigraftctl = "lab_39_sigraft_service.sigraftctl:main"

[project.optional-dependencies]
dev = [
  "pybootstrap[gates] @ git+https://github.com/packetfive/pybootstrap.git@32a0e5c64a3a2fe3269a051ec39700a9b9a25a55",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
]
azure = [
  "azure-monitor-opentelemetry-exporter>=1.0.0b30,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab_39_sigraft_service = ["data/*.csv"]

[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 80
coverage-package = "lab_39_sigraft_service"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov-report=term-missing --import-mode=importlib"
