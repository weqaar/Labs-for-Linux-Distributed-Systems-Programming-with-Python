trigger: none
pr: none
variables:
  acrName: sigraftacr
  acrLoginServer: sigraft.azurecr.io
  imageName: sigraft
  evidenceFile: artifacts/release-evidence.json
  baselineUrl: https://sigraft-production.example
  candidateUrl: https://sigraft-staging.example
  stagingObservationsFile: $(Pipeline.Workspace)/sigraft-staging-observations.csv
stages:
  - stage: Quality
    jobs:
      - job: QualityGate
        steps:
          - script: make structure
          - script: make labs
          - script: python -m lab_39_sigraft_service.release verify-evidence --evidence $(evidenceFile) --commit $(Build.SourceVersion)
  - stage: Infrastructure
    dependsOn: Quality
    jobs:
      - deployment: SigRaftInfrastructure
        environment: infrastructure
        strategy:
          runOnce:
            deploy:
              steps:
                - script: az bicep build --file labs/08-azure-resources/infra/main.bicep
                - script: az deployment group what-if --resource-group rg-sigraft-staging --parameters labs/08-azure-resources/infra/environments/staging.bicepparam
                - script: az deployment group create --resource-group rg-sigraft-staging --parameters labs/08-azure-resources/infra/environments/staging.bicepparam
                - script: az deployment group what-if --resource-group rg-sigraft-prod --parameters labs/08-azure-resources/infra/environments/prod.bicepparam
                - script: az deployment group create --resource-group rg-sigraft-prod --parameters labs/08-azure-resources/infra/environments/prod.bicepparam
  - stage: Build
    dependsOn: Infrastructure
    jobs:
      - job: BuildOnce
        steps:
          - script: az acr build --registry $(acrName) --image $(imageName):$(Build.SourceVersion) .
          - script: python -m lab_39_sigraft_service.release emit-digests --evidence $(evidenceFile) --commit $(Build.SourceVersion)
            name: captureDigest
  - stage: DeployStaging
    dependsOn: Build
    variables:
      sigraftDigest: $[ stageDependencies.Build.BuildOnce.outputs['captureDigest.sigraftDigest'] ]
      previousDigest: $[ stageDependencies.Build.BuildOnce.outputs['captureDigest.previousDigest'] ]
    jobs:
      - deployment: SigRaftStaging
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: kubectl set image deployment/sigraft sigraft=$(acrLoginServer)/$(imageName)@$(sigraftDigest)
                - script: python -m lab_39_sigraft_service.fabric_executor verify --hosts sigraft-staging-a,sigraft-staging-b --expected-digest $(sigraftDigest)
                - script: python -m lab_39_sigraft_service.observation_probe --baseline-url $(baselineUrl) --candidate-url $(candidateUrl) --output $(stagingObservationsFile)
                - script: python -m lab_39_sigraft_service.analytics_service verify-release --candidate-digest $(sigraftDigest) --observations $(stagingObservationsFile)
  - stage: DeployProduction
    dependsOn: [Build, DeployStaging]
    variables:
      sigraftDigest: $[ stageDependencies.Build.BuildOnce.outputs['captureDigest.sigraftDigest'] ]
      previousDigest: $[ stageDependencies.Build.BuildOnce.outputs['captureDigest.previousDigest'] ]
    jobs:
      - deployment: SigRaftProduction
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: kubectl set image deployment/sigraft sigraft=$(acrLoginServer)/$(imageName)@$(sigraftDigest)
                - script: python -m lab_39_sigraft_service.fabric_executor verify --hosts sigraft-prod-a,sigraft-prod-b --expected-digest $(sigraftDigest)
  - stage: Rollback
    dependsOn: [Build, DeployProduction]
    condition: failed('DeployProduction')
    variables:
      previousDigest: $[ stageDependencies.Build.BuildOnce.outputs['captureDigest.previousDigest'] ]
    jobs:
      - job: RollbackDigest
        steps:
          - script: kubectl set image deployment/sigraft sigraft=$(acrLoginServer)/$(imageName)@$(previousDigest)
