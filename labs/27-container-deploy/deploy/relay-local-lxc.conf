lxc.include = /usr/share/lxc/config/common.conf
lxc.uts.name = relay
lxc.rootfs.path = dir:/srv/relay/rootfs
lxc.rootfs.options = ro
lxc.apparmor.profile = generated
lxc.apparmor.allow_nesting = 0
lxc.no_new_privs = 1
lxc.mount.auto = proc:mixed sys:ro cgroup:mixed
lxc.idmap = u 0 100000 65536
lxc.idmap = g 0 100000 65536
lxc.cap.drop = sys_admin sys_module sys_time sys_boot mac_admin mac_override setfcap sys_rawio
lxc.net.0.type = veth
lxc.net.0.link = lxcbr0
lxc.net.0.flags = up
lxc.net.0.name = eth0
lxc.environment = RELAY_PORT=8080
