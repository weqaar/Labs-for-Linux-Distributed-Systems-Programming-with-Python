[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-10-native-extension"
version = "0.1.0"
description = "Lab for the corresponding chapter of Linux Distributed Systems Programming with Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Weqaar Janjua", email = "weqaar.janjua@packetfive.com" }]
dependencies = []

[project.optional-dependencies]
# Everything the quality gates need. One command installs a working dev setup:
#   pip install -e ".[dev]"
dev = [
  "pybootstrap[gates] @ git+https://github.com/packetfive/pybootstrap.git@32a0e5c64a3a2fe3269a051ec39700a9b9a25a55",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
]

[tool.setuptools]
ext-modules = [
  { name = "lab_10_native_extension._framing_native", sources = ["src/lab_10_native_extension/_framing_native.c"] },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab_10_native_extension = ["_framing_native.pyi"]

# ---------------------------------------------------------------------------
# Quality gates.
#
# This table says which checks make up "done" for this project. It does not
# restate anything the tools below already know: sources, line length and test
# paths are read from their own tables. One fact, one place.
# ---------------------------------------------------------------------------
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 80
coverage-package = "lab_10_native_extension"

# ---------------------------------------------------------------------------
# Standard tool configuration. Each tool stays usable on its own:
#   ruff check src tests
#   pyright src tests
#   pytest
# behave identically whether or not pybootstrap is involved.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov-report=term-missing --import-mode=importlib"
