apiVersion: batch/v1
kind: Job
metadata:
  name: loki-object-user
  namespace: data
  labels:
    app.kubernetes.io/managed-by: sigraft-on-prem
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {app: loki-object-user}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: minio/mc:RELEASE.2025-02-21T16-00-46Z
          command: [/bin/sh, -ec]
          args:
            - >-
              mc alias set local http://minio.data.svc.cluster.local:9000
              "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD";
              mc admin user add local "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY";
              mc admin policy attach local readwrite --user "$AWS_ACCESS_KEY_ID"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: minio-credentials, key: root-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: minio-credentials, key: root-password}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: loki-object-store, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: loki-object-store, key: AWS_SECRET_ACCESS_KEY}}
