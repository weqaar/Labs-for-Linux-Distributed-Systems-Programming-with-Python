deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: http://minio.data.svc.cluster.local:9000
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: true
singleBinary:
  replicas: 1
  persistence: {size: 50Gi}
  extraArgs: ["-config.expand-env=true"]
  extraEnvFrom:
    - secretRef: {name: loki-object-store}
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
