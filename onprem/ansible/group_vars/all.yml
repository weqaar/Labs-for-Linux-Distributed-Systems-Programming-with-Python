ownership_prefix: "{{ name }}"
artifact_root: "{{ playbook_dir }}/.."
state_root: "/var/lib/{{ ownership_prefix }}"
kolla_ansible_version: "19.5.0"
kolla_ansible_core_version: "2.17.7"
kubespray_version: "v2.27.0"
kubernetes_version: "v1.31.4"

helm_repositories:
  - {name: harbor, url: "https://helm.goharbor.io"}
  - {name: ingress-nginx, url: "https://kubernetes.github.io/ingress-nginx"}
  - {name: metallb, url: "https://metallb.github.io/metallb"}
  - {name: rancher, url: "https://charts.rancher.io"}
  - {name: bitnami, url: "https://charts.bitnami.com/bitnami"}
  - {name: open-telemetry, url: "https://open-telemetry.github.io/opentelemetry-helm-charts"}
  - {name: jaegertracing, url: "https://jaegertracing.github.io/helm-charts"}
  - {name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts"}
  - {name: grafana, url: "https://grafana.github.io/helm-charts"}

edge_charts:
  - {name: local-path, chart: rancher/local-path-provisioner, version: "0.0.31", namespace: kube-system, values: local-path.yaml}
  - {name: metallb, chart: metallb/metallb, version: "0.14.9", namespace: metallb-system, values: metallb.yaml}
  - {name: ingress-nginx, chart: ingress-nginx/ingress-nginx, version: "4.12.0", namespace: ingress-nginx, values: ingress-nginx.yaml}

data_charts:
  - {name: harbor, chart: harbor/harbor, version: "1.16.2", namespace: registry, values: harbor.yaml}
  - {name: postgresql, chart: bitnami/postgresql, version: "16.4.5", namespace: data, values: postgresql.yaml}
  - {name: rabbitmq, chart: bitnami/rabbitmq, version: "15.2.4", namespace: messaging, values: rabbitmq.yaml}
  - {name: valkey, chart: bitnami/valkey, version: "2.1.7", namespace: data, values: valkey.yaml}
  - {name: minio, chart: bitnami/minio, version: "14.10.5", namespace: data, values: minio.yaml}

observability_charts:
  - {name: jaeger, chart: jaegertracing/jaeger, version: "3.4.1", namespace: observability, values: jaeger.yaml}
  - {name: loki, chart: grafana/loki, version: "6.25.0", namespace: data, values: loki.yaml}
  - {name: prometheus, chart: prometheus-community/kube-prometheus-stack, version: "69.3.1", namespace: observability, values: prometheus.yaml}
  - {name: otel, chart: open-telemetry/opentelemetry-collector, version: "0.117.0", namespace: observability, values: otel.yaml}
